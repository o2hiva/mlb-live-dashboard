<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLB Live Dashboard</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #131c2e;
    --text: #e8ecf4;
    --muted: #8b96ab;
    --accent: #4fd1c5;
    --live: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; font-size: 0.85rem; }
  #status-line { margin-bottom: 16px; font-size: 0.8rem; color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
  }
  @media (max-width: 1100px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .teams { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 6px; gap: 8px; }
  .teams > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score { font-size: 1.3rem; flex-shrink: 0; }
  .meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--live); margin-right: 6px;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .prob-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  .prob-bar-bg { background: rgba(255,255,255,0.08); border-radius: 6px; height: 10px; overflow: hidden; }
  .prob-bar-fill { background: var(--accent); height: 100%; }
  .prob-value { margin-top: 6px; font-size: 0.9rem; }
  .pitchers { font-size: 0.75rem; color: var(--muted); margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lineup-status { font-size: 0.75rem; color: var(--muted); font-weight: 400; }
  .lineup-status.confirmed { color: var(--accent); }
  .hits-toggle { font-size: 0.75rem; color: var(--accent); cursor: pointer; text-decoration: underline; }
  .lineup-tabs { display: flex; gap: 14px; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 4px; }
  .lineup-tab { cursor: pointer; font-size: 0.72rem; color: var(--muted); padding-bottom: 2px; }
  .lineup-tab.active { color: var(--accent); font-weight: 600; border-bottom: 2px solid var(--accent); }
  .hits-container { margin-top: 8px; overflow-x: auto; }
  .hits-controls { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
  .hits-controls select { background: var(--bg); color: var(--text); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; padding: 2px 4px; }
  .hits-side-label { font-size: 0.7rem; color: var(--muted); margin-top: 8px; margin-bottom: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .hits-batter { display: grid; grid-template-columns: 1.3fr 36px 34px 34px 46px 52px 30px 60px 60px 40px; align-items: center; gap: 4px; font-size: 0.72rem; padding: 3px 0; }
  .hits-batter > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hits-batter-header { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 4px; margin-top: 6px; }
  .hits-batter select, .hits-batter input {
    background: var(--bg); color: var(--text); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px; padding: 1px 2px; font-size: 0.7rem; width: 100%;
  }
  .hits-batter input[type="checkbox"] { width: auto; justify-self: center; }
  .hits-index { color: var(--muted); font-size: 0.7rem; text-align: center; }
  .hits-batter > span:last-child { text-align: right; }
  .hits-na { color: var(--muted); font-size: 0.75rem; }
  .hits-loading { font-size: 0.75rem; color: var(--muted); }
  .empty { color: var(--muted); }
  .tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .tab-btn { cursor: pointer; color: var(--muted); font-size: 0.95rem; padding-bottom: 8px; }
  .tab-btn.active { color: var(--text); font-weight: 600; border-bottom: 2px solid var(--accent); }
  h2 { font-size: 1.1rem; margin: 0 0 12px 0; }
  .settings-row { display: flex; gap: 28px; align-items: flex-end; }
  .settings-field { display: flex; flex-direction: column; gap: 4px; }
  .settings-field label { font-size: 0.8rem; color: var(--muted); }
  .settings-field input {
    background: var(--card); color: var(--text); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; padding: 8px 10px; font-size: 1rem; width: 160px;
  }
  .settings-hint { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  .platform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; margin-top: 16px; }
  .bankroll-total { font-size: 1.8rem; font-weight: 600; margin-top: 4px; }
  .tracked-bets-list { font-size: 0.85rem; }
  .tracked-bet-row {
    display: grid; grid-template-columns: 1.5fr 1fr 0.7fr 0.6fr 0.7fr 0.7fr 0.6fr;
    gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .tracked-bet-header { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.02em; font-weight: 600; }
  .tracked-bet-remove { color: var(--live); cursor: pointer; font-size: 0.75rem; text-decoration: underline; }
</style>
</head>
<body>
  <h1>MLB Live Dashboard</h1>
  <div class="tabs">
    <span id="tab-btn-live" class="tab-btn active" onclick="switchTab('live')">Live Games</span>
    <span id="tab-btn-bettracker" class="tab-btn" onclick="switchTab('bettracker')">Bet Tracker</span>
  </div>

  <div id="tab-content-live">
    <div class="sub">First-inning run probability, updated live during games.</div>
    <div style="margin-bottom:16px;">
      <label for="date-picker" style="font-size:0.8rem; color:var(--muted); margin-right:8px;">Date:</label>
      <input id="date-picker" type="date" style="background:var(--card); color:var(--text); border:1px solid rgba(255,255,255,0.15); border-radius:6px; padding:4px 8px;" />
    </div>
    <div id="status-line">Loading...</div>
    <div id="grid" class="grid"></div>
  </div>

  <div id="tab-content-bettracker" style="display:none;">
    <h2>Bankroll</h2>
    <div class="bankroll-total" id="bankroll-total">$0.00</div>
    <div class="platform-grid">
      <div class="settings-field">
        <label for="kalshi-input">Kalshi</label>
        <input id="kalshi-input" type="number" step="0.01" min="0" onchange="saveBetTrackerSettings()" oninput="updateBankrollTotalDisplay()" />
      </div>
      <div class="settings-field">
        <label for="polymarket-input">Polymarket</label>
        <input id="polymarket-input" type="number" step="0.01" min="0" onchange="saveBetTrackerSettings()" oninput="updateBankrollTotalDisplay()" />
      </div>
      <div class="settings-field">
        <label for="novig-input">NoVig</label>
        <input id="novig-input" type="number" step="0.01" min="0" onchange="saveBetTrackerSettings()" oninput="updateBankrollTotalDisplay()" />
      </div>
      <div class="settings-field">
        <label for="fanduel-input">FanDuel</label>
        <input id="fanduel-input" type="number" step="0.01" min="0" onchange="saveBetTrackerSettings()" oninput="updateBankrollTotalDisplay()" />
      </div>
      <div class="settings-field">
        <label for="draftkings-input">DraftKings</label>
        <input id="draftkings-input" type="number" step="0.01" min="0" onchange="saveBetTrackerSettings()" oninput="updateBankrollTotalDisplay()" />
      </div>
    </div>
    <div class="settings-row" style="margin-top:24px;">
      <div class="settings-field">
        <label for="kelly-input">Kelly Criterion (%)</label>
        <input id="kelly-input" type="number" step="1" min="0" max="100" onchange="saveBetTrackerSettings()" />
      </div>
    </div>
    <div class="settings-hint">e.g. 25% runs quarter-Kelly - sizes each bet at 25% of what full Kelly would suggest, a common way to reduce swings from model error.</div>

    <h2 style="margin-top:32px;">Tracked Bets</h2>
    <div id="tracked-bets-list" class="tracked-bets-list">Loading...</div>
  </div>

<script>
  // Same-origin: the backend now serves this page directly, so no
  // separate URL is needed, whether running locally or deployed.
  const API_BASE = "";

  const REFRESH_MS = 10000;
  let lastFetchedGames = [];

  function todayIso() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  const datePicker = document.getElementById("date-picker");
  datePicker.value = todayIso();
  datePicker.addEventListener("change", fetchGames);

  async function fetchGames() {
    const selectedDate = datePicker.value || todayIso();
    try {
      const res = await fetch(`${API_BASE}/api/games/today?game_date=${selectedDate}`);
      const games = await res.json();
      lastFetchedGames = games;
      render(games);
      document.getElementById("status-line").textContent =
        `Showing ${selectedDate} — last updated ${new Date().toLocaleTimeString()} — polling every ${REFRESH_MS / 1000}s`;
    } catch (e) {
      document.getElementById("status-line").textContent =
        "Couldn't reach backend — is it running at " + API_BASE + " ?";
    }
  }

  function render(games) {
    const grid = document.getElementById("grid");
    if (!games || games.length === 0) {
      grid.innerHTML = `<div class="empty">No games found for this date.</div>`;
      return;
    }
    grid.innerHTML = games.map(cardHtml).join("");
    reapplyExpandedLineups();
  }

  function formatLocalStartTime(isoUtc) {
    // Browsers always render Date objects in the DEVICE'S OWN timezone
    // unless told otherwise - so this automatically shows Pacific time
    // for a Pacific-based viewer, Japan time for a viewer in Japan, etc.
    // No location detection needed on our end; the browser already knows.
    if (!isoUtc) return null;
    const d = new Date(isoUtc);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false, timeZoneName: "short" });
  }

  function cardHtml(g) {
    const isLive = g.status === "In Progress";
    const isFinal = g.status === "Final" || g.status === "Game Over";
    const startTime = formatLocalStartTime(g.game_datetime_utc);
    const yesProb = g.first_inning_run_yes_probability;
    const noProb = g.first_inning_run_no_probability;
    const yesPct = yesProb != null ? Math.round(yesProb * 100) : null;
    const noPct = noProb != null ? Math.round(noProb * 100) : null;

    let statusLabel;
    if (isLive) {
      statusLabel = '<span class="live-dot"></span>LIVE';
    } else if (isFinal) {
      statusLabel = g.status;
    } else if (startTime) {
      statusLabel = startTime;
    } else {
      statusLabel = g.status;
    }

    // Lineup confirmation only means anything before the game starts -
    // once it's live or final, the lineup was necessarily confirmed.
    const showLineupStatus = !isLive && !isFinal;
    function lineupLabel(confirmed) {
      if (!showLineupStatus) return "";
      return confirmed
        ? '<span class="lineup-status confirmed">Confirmed</span>'
        : '<span class="lineup-status">Not Confirmed</span>';
    }

    return `
      <div class="card">
        <div class="meta">
          ${statusLabel}
          ${g.inning ? ` · Inning ${g.inning} ${g.inning_half || ""}` : ""}
        </div>
        <div class="teams">
          <span>${g.away_team} ${lineupLabel(g.away_lineup_confirmed)}</span>
          <span class="score">${g.away_score ?? "-"}</span>
        </div>
        <div class="teams">
          <span>${g.home_team} ${lineupLabel(g.home_lineup_confirmed)}</span>
          <span class="score">${g.home_score ?? "-"}</span>
        </div>
        <div class="pitchers">
          ${g.away_probable_pitcher || "TBD"} vs ${g.home_probable_pitcher || "TBD"}
        </div>
        ${yesPct != null ? `
          <div style="margin-top:16px;">
            <div class="prob-label">1st-inning run scored? (${g.model_version || "n/a"})</div>
            <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--muted); margin-bottom:2px;">
              <span>Yes</span><span>No</span>
            </div>
            <div class="prob-bar-bg" style="display:flex;">
              <div style="background:var(--accent); height:100%; width:${yesPct}%;"></div>
              <div style="background:var(--live); height:100%; width:${noPct}%;"></div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:6px; font-size:0.9rem;">
              <span>Yes: ${yesPct}%</span><span>No: ${noPct}%</span>
            </div>
            <div class="hits-batter hits-batter-header" style="grid-template-columns: 46px 52px 30px 60px 60px 40px; margin-top:10px;">
              <span>Y/N</span><span>Market</span><span>Kelly</span><span>Wager</span><span>Profit</span><span>Track</span>
            </div>
            <div class="hits-batter" style="grid-template-columns: 46px 52px 30px 60px 60px 40px;">
              ${firstInningBetRowCellsHtml(g.game_pk, yesPct, noPct)}
            </div>
          </div>` : ""}
        ${(g.home_lineup_confirmed || g.away_lineup_confirmed) ? `
          <div style="margin-top:14px;">
            <span id="lineup-toggle-${g.game_pk}" class="hits-toggle" onclick="toggleLineup(${g.game_pk})">Show Lineup ▾</span>
            <div id="lineup-container-${g.game_pk}" class="hits-container" style="display:none;"></div>
          </div>` : ""}
      </div>
    `;
  }

  // ---- Hits prop: confirmed batters, adjustable "at least H hits" ----
  // State lives outside cardHtml/render so it survives the 10s poll
  // refresh, which otherwise rebuilds the whole grid (and would
  // collapse/re-fetch everything on every cycle without this).
  const hitsThresholdByGame = {};
  const hitsDataCache = {};

  function combination(n, k) {
    if (k < 0 || k > n) return 0;
    let result = 1;
    for (let i = 0; i < k; i++) result = (result * (n - i)) / (i + 1);
    return result;
  }

  function probAtLeastHits(n, p, h) {
    // P(X >= h) for X ~ Binomial(n, p). n is small (~2-4, from lineup
    // position), so direct summation is exact and instant - no need
    // for a library. This is what recomputes instantly in the browser
    // whenever the "at least __ hit(s)" selector changes.
    let cumulative = 0;
    for (let i = 0; i < h; i++) {
      cumulative += combination(n, i) * Math.pow(p, i) * Math.pow(1 - p, n - i);
    }
    return Math.max(0, Math.min(1, 1 - cumulative));
  }

  // ---- Lineup section: ONE expandable area per game, with an internal
  // Hits/HRR tab switch inside it (not two separate stacked sections). ----
  const expandedLineupGames = new Set();
  const activeLineupTab = {}; // gamePk -> "hits" | "hrr", default "hits"

  function toggleLineup(gamePk) {
    if (expandedLineupGames.has(gamePk)) {
      expandedLineupGames.delete(gamePk);
    } else {
      expandedLineupGames.add(gamePk);
      if (!activeLineupTab[gamePk]) activeLineupTab[gamePk] = "hits";
      if (!hitsThresholdByGame[gamePk]) hitsThresholdByGame[gamePk] = 1;
      if (hrrLineByGame[gamePk] == null) hrrLineByGame[gamePk] = 1.5;
    }
    renderLineupSection(gamePk);
  }

  function switchLineupTab(gamePk, tab) {
    activeLineupTab[gamePk] = tab;
    renderLineupSection(gamePk);
  }

  function setHitsThreshold(gamePk, value) {
    hitsThresholdByGame[gamePk] = parseInt(value, 10);
    rerenderHits(gamePk); // instant re-render from cache, no fetch
  }

  // ---- Bet sizing (Kelly Criterion) ----
  // Bankroll/Kelly% are fetched once at page load and refreshed whenever
  // saved on the Bet Tracker tab, so the Hits section can size wagers
  // without an extra round-trip on every row.
  let currentBankroll = 0;
  let currentKellyPercent = 25;

  async function refreshGlobalBankrollSettings() {
    try {
      const res = await fetch(`${API_BASE}/api/bet-tracker/settings`);
      const data = await res.json();
      currentBankroll = data.bankroll || 0;
      currentKellyPercent = data.kelly_percent || 0;
    } catch (e) {
      // Keep whatever we had before - Hits wagers just won't reflect
      // a change made on another device until this succeeds.
    }
  }

  // Per-batter bet state (Y/N side, market %, Kelly on/off, manual wager),
  // keyed by game+side+batter so it survives re-renders within a session.
  // NOT persisted to the backend - resets on page reload, same as the
  // Hits toggle/threshold state above.
  const hitsBetState = {};

  function getBetState(gamePk, side, batterId) {
    if (!hitsBetState[gamePk]) hitsBetState[gamePk] = {};
    const key = `${side}_${batterId}`;
    if (!hitsBetState[gamePk][key]) {
      hitsBetState[gamePk][key] = { yn: "yes", market: null, useKelly: true, manualWager: 0, tracked: false, trackedId: null };
    }
    return hitsBetState[gamePk][key];
  }

  function updateBetField(gamePk, side, batterId, field, value) {
    const state = getBetState(gamePk, side, batterId);
    if (field === "market") {
      state.market = value === "" ? null : parseFloat(value);
    } else if (field === "manualWager") {
      state.manualWager = parseFloat(value) || 0;
    } else {
      state[field] = value;
    }
    rerenderHits(gamePk);
  }

  function kellyWagerAmount(modelProb, marketPct) {
    // f* = (p - m) / (1 - m) - the standard Kelly fraction for a fair
    // binary market priced at probability m (as opposed to decimal
    // betting odds), which is how Kalshi/Polymarket/NoVig quote prices.
    if (modelProb == null || marketPct == null || isNaN(marketPct)) return 0;
    const m = marketPct / 100;
    if (m <= 0 || m >= 1) return 0;
    const edge = (modelProb - m) / (1 - m);
    const fraction = Math.max(0, edge) * (currentKellyPercent / 100);
    return fraction * currentBankroll;
  }

  function profitIfWon(wager, marketPct) {
    // At a fair price of m, winning pays (1-m)/m per dollar wagered.
    if (!wager || marketPct == null || isNaN(marketPct) || marketPct <= 0) return null;
    const m = marketPct / 100;
    return wager * (1 - m) / m;
  }

  // ---- 1st-inning market: same betting mechanics as Hits, but one row
  // per GAME (not per batter) since it's a single game-level probability. ----
  const firstInningBetState = {};

  function getFirstInningBetState(gamePk) {
    if (!firstInningBetState[gamePk]) {
      firstInningBetState[gamePk] = { yn: "yes", market: null, useKelly: true, manualWager: 0, tracked: false, trackedId: null };
    }
    return firstInningBetState[gamePk];
  }

  function updateFirstInningBetField(gamePk, field, value) {
    const state = getFirstInningBetState(gamePk);
    if (field === "market") {
      state.market = value === "" ? null : parseFloat(value);
    } else if (field === "manualWager") {
      state.manualWager = parseFloat(value) || 0;
    } else {
      state[field] = value;
    }
    render(lastFetchedGames); // cheap - rebuilds from already-fetched data, no network call
  }

  async function toggleFirstInningTrack(gamePk, checked, modelProb, marketPct, wager, profit) {
    const state = getFirstInningBetState(gamePk);
    if (checked) {
      try {
        const res = await fetch(`${API_BASE}/api/bet-tracker/track`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            game_pk: gamePk, bet_type: "first_inning_run", batter_name: "1st Inning Run",
            yn: state.yn, model_probability: modelProb, market_probability: marketPct,
            wager: wager, potential_profit: profit,
          }),
        });
        const data = await res.json();
        state.tracked = true;
        state.trackedId = data.id;
      } catch (e) {
        state.tracked = false;
      }
    } else if (state.trackedId != null) {
      try {
        await fetch(`${API_BASE}/api/bet-tracker/track/${state.trackedId}`, { method: "DELETE" });
      } catch (e) {
        // Best-effort - the Bet Tracker tab's Remove button can clean it up.
      }
      state.tracked = false;
      state.trackedId = null;
    }
    render(lastFetchedGames);
  }

  function firstInningBetRowCellsHtml(gamePk, yesPct, noPct) {
    const state = getFirstInningBetState(gamePk);
    const modelPct = state.yn === "yes" ? yesPct : noPct;
    const modelProb = modelPct != null ? modelPct / 100 : null;

    const wager = state.useKelly ? kellyWagerAmount(modelProb, state.market) : state.manualWager;
    const profit = profitIfWon(wager, state.market);

    const marketVal = state.market != null ? state.market : "";
    const idBase = `fi-${gamePk}`;

    const wagerCell = state.useKelly
      ? `<span>$${wager.toFixed(2)}</span>`
      : `<input id="wager-${idBase}" type="number" step="0.01" min="0" value="${state.manualWager}"
           onchange="updateFirstInningBetField(${gamePk},'manualWager',this.value)" />`;

    const trackArgs = `${gamePk},this.checked,${modelProb},${state.market},${wager},${profit}`;

    return `
      <select id="yn-${idBase}" onchange="updateFirstInningBetField(${gamePk},'yn',this.value)">
        <option value="yes" ${state.yn === "yes" ? "selected" : ""}>Yes</option>
        <option value="no" ${state.yn === "no" ? "selected" : ""}>No</option>
      </select>
      <input id="market-${idBase}" type="number" step="0.1" min="0" max="100" value="${marketVal}" placeholder="%"
        onchange="updateFirstInningBetField(${gamePk},'market',this.value)" />
      <input id="kelly-${idBase}" type="checkbox" ${state.useKelly ? "checked" : ""}
        onchange="updateFirstInningBetField(${gamePk},'useKelly',this.checked)" />
      ${wagerCell}
      <span>${profit != null ? "$" + profit.toFixed(2) : "—"}</span>
      <input id="track-${idBase}" type="checkbox" ${state.tracked ? "checked" : ""} onchange="toggleFirstInningTrack(${trackArgs})" />
    `;
  }

  // ---- HRR prop: same structure as Hits, but a NORMAL distribution
  // (mean/sd) instead of binomial (n_ab/p), since HRR production is
  // modeled as continuous, not a count of discrete at-bats. ----
  const hrrLineByGame = {};
  const hrrDataCache = {};
  const hrrBetState = {};

  function lgamma(x) {
    // Lanczos approximation to the log-gamma function (g=7, n=9 coefficients),
    // accurate to ~15 significant digits for x > 0 - avoids needing a math
    // library just for this. Used to compute the Negative Binomial PMF for
    // non-integer r, the same way core.py's formula does via scipy/math.lgamma.
    const g = 7;
    const coeffs = [
      0.99999999999980993, 676.5203681218851, -1259.1392167224028,
      771.32342877765313, -176.61502916214059, 12.507343278686905,
      -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7,
    ];
    if (x < 0.5) {
      // Reflection formula for x < 0.5 - not needed for our use (r, k+r > 0 always) but kept for safety.
      return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgamma(1 - x);
    }
    x -= 1;
    let a = coeffs[0];
    const t = x + g + 0.5;
    for (let i = 1; i < g + 2; i++) a += coeffs[i] / (x + i);
    return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
  }

  function nbinomSf(thresholdInt, r, p) {
    // 1 - CDF(thresholdInt) for Negative Binomial(r, p) - same math as
    // hrr_stats_sync.py's _nbinom_sf, just in JS so the line can change
    // instantly without a server round-trip.
    if (r == null || p == null || r <= 0 || p <= 0 || p >= 1) return null;
    const logP = Math.log(p), log1mP = Math.log(1 - p);
    let cdf = 0;
    for (let k = 0; k <= thresholdInt; k++) {
      const logPmf = lgamma(k + r) - lgamma(r) - lgamma(k + 1) + r * logP + k * log1mP;
      cdf += Math.exp(logPmf);
    }
    return Math.max(0, Math.min(1, 1 - cdf));
  }

  function probHrrAtLeast(r, p, line) {
    if (r == null || p == null) return null;
    return nbinomSf(Math.trunc(line), r, p);
  }

        <span class="lineup-tab ${tab === "hr" ? "active" : ""}" onclick="switchLineupTab(${gamePk},'hr')">HR</span>
        <span class="lineup-tab ${tab === "hrr" ? "active" : ""}" onclick="switchLineupTab(${gamePk},'hrr')">HRR</span>
      </div>
      <div id="lineup-content-${gamePk}"></div>
    `;
    const contentDiv = document.getElementById(`lineup-content-${gamePk}`);

    const TAB_CONFIG = {
      hits: { cache: hitsDataCache, render: hitsSectionHtml, path: "hits" },
      hr: { cache: hrDataCache, render: hrSectionHtml, path: "hr" },
      hrr: { cache: hrrDataCache, render: hrrSectionHtml, path: "hrr" },
    };
    const { cache: dataCache, render: sectionHtmlFn, path: apiPath } = TAB_CONFIG[tab];

    if (dataCache[gamePk]) {
      contentDiv.innerHTML = sectionHtmlFn(gamePk, dataCache[gamePk]);
      return;
    }

    contentDiv.innerHTML = `<div class="hits-loading">Loading batters...</div>`;
    fetch(`${API_BASE}/api/games/${gamePk}/${apiPath}`)
      .then(res => res.json())
      .then(data => {
        dataCache[gamePk] = data;
        // Only paint the result if the viewer hasn't switched tabs/collapsed
        // the section while this fetch was in flight.
        if (expandedLineupGames.has(gamePk) && (activeLineupTab[gamePk] || "hits") === tab) {
          contentDiv.innerHTML = sectionHtmlFn(gamePk, data);
        }
      })
      .catch(() => {
        if (expandedLineupGames.has(gamePk) && (activeLineupTab[gamePk] || "hits") === tab) {
          contentDiv.innerHTML = `<div class="hits-loading">Couldn't load batters.</div>`;
        }
      });
  }

  function reapplyExpandedLineups() {
    // The 10s poll refresh rebuilds the whole grid from scratch, so any
    // previously-expanded lineup section needs to be restored afterward -
    // from cache (instant) rather than re-fetched, since batter season
    // stats don't change within a browsing session.
    expandedLineupGames.forEach(renderLineupSection);
  }

  fetchGames();
  setInterval(fetchGames, REFRESH_MS);
  refreshGlobalBankrollSettings();

  // ---- Bet Tracker tab ----
  const PLATFORM_FIELDS = ["kalshi", "polymarket", "novig", "fanduel", "draftkings"];

  function switchTab(tab) {
    const isLive = tab === "live";
    document.getElementById("tab-content-live").style.display = isLive ? "block" : "none";
    document.getElementById("tab-content-bettracker").style.display = isLive ? "none" : "block";
    document.getElementById("tab-btn-live").classList.toggle("active", isLive);
    document.getElementById("tab-btn-bettracker").classList.toggle("active", !isLive);
    if (!isLive) {
      loadBetTrackerSettings();
      loadTrackedBets();
    }
  }

  async function loadTrackedBets() {
    const container = document.getElementById("tracked-bets-list");
    try {
      const res = await fetch(`${API_BASE}/api/bet-tracker/tracked`);
      const bets = await res.json();
      if (!bets.length) {
        container.innerHTML = `<div class="settings-hint">No bets tracked yet - check the Track box on a Hits row to add one.</div>`;
        return;
      }
      const header = `
        <div class="tracked-bet-row tracked-bet-header">
          <span>Batter</span><span>Matchup</span><span>Y/N</span><span>Line</span>
          <span>Market</span><span>Wager</span><span></span>
        </div>`;
      const rows = bets.map(b => `
        <div class="tracked-bet-row">
          <span>${b.batter_name}</span>
          <span>${b.matchup}</span>
          <span>${b.yn}</span>
          <span>${b.line != null ? (b.bet_type === "hrr" ? b.line : b.line + "+") : "—"}</span>
          <span>${b.market_probability != null ? b.market_probability + "%" : "—"}</span>
          <span>${b.wager != null ? "$" + b.wager.toFixed(2) : "—"}</span>
          <span class="tracked-bet-remove" onclick="removeTrackedBet(${b.id})">Remove</span>
        </div>`).join("");
      container.innerHTML = header + rows;
    } catch (e) {
      container.innerHTML = `<div class="settings-hint">Couldn't load tracked bets.</div>`;
    }
  }

  async function removeTrackedBet(id) {
    try {
      await fetch(`${API_BASE}/api/bet-tracker/track/${id}`, { method: "DELETE" });
    } catch (e) {
      // Best-effort - reloading the list will show the true current state either way.
    }
    loadTrackedBets();
  }

  function updateBankrollTotalDisplay() {
    let total = 0;
    PLATFORM_FIELDS.forEach(name => {
      total += parseFloat(document.getElementById(`${name}-input`).value) || 0;
    });
    document.getElementById("bankroll-total").textContent =
      "$" + total.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  async function loadBetTrackerSettings() {
    try {
      const res = await fetch(`${API_BASE}/api/bet-tracker/settings`);
      const data = await res.json();
      PLATFORM_FIELDS.forEach(name => {
        document.getElementById(`${name}-input`).value = data[`${name}_balance`];
      });
      document.getElementById("kelly-input").value = data.kelly_percent;
      document.getElementById("bankroll-total").textContent =
        "$" + data.bankroll.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    } catch (e) {
      // Leave inputs as-is if the backend can't be reached - same
      // failure mode as the Live Games tab's own fetch.
    }
  }

  async function saveBetTrackerSettings() {
    updateBankrollTotalDisplay(); // instant feedback before the round-trip completes
    const payload = { kelly_percent: parseFloat(document.getElementById("kelly-input").value) || 0 };
    PLATFORM_FIELDS.forEach(name => {
      payload[`${name}_balance`] = parseFloat(document.getElementById(`${name}-input`).value) || 0;
    });
    try {
      const res = await fetch(`${API_BASE}/api/bet-tracker/settings`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      // Reconcile with the server's computed total (source of truth),
      // in case it differs from our instant local sum for any reason.
      document.getElementById("bankroll-total").textContent =
        "$" + data.bankroll.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      // Keep the Hits tab's wager sizing in sync with whatever was just saved.
      currentBankroll = data.bankroll || 0;
      currentKellyPercent = data.kelly_percent || 0;
      Object.keys(hitsDataCache).forEach(gamePk => rerenderHits(Number(gamePk)));
    } catch (e) {
      // Best-effort - next load will just show the last saved values.
    }
  }
</script>
</body>
</html>
